---
to: pdf
pdf-engine: xelatex
standalone: true
filters:
  - table-rules.lua
include-in-header:
  - ${USERDATA}/includes/table-spacing.tex
variables:
  mainfont: Ysabeau-Regular
  mainfontoptions:
    - BoldFont=Ysabeau-SemiBold
    - ItalicFont=Ysabeau-LightItalic
    - BoldItalicFont=Ysabeau-MediumItalic
    - CharacterWidth=Quarter
    - Kerning=On
    - Ligatures=Contextual
    - Numbers=Uppercase
    - Numbers=SlashedZero
  fontsize: 12pt
  papersize: letter
  geometry:
    - left=1.25in
    - right=1.25in
    - top=0.5in
    - bottom=0.75in
